name: python script

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["python script"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every 3 minutes for 5 hours
        run: |
          git config user.name "brutal-45"
          git config user.email "creatorsports81@gmail.com"
          
          # 100 iterations x 3 minutes = 300 minutes (5 hours)
          # Keeps execution safely under GitHub's 6-hour execution limit
          for i in {1..100}; do
            TIMESTAMP_FILE="updates.txt"
            echo "Last checked: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > "$TIMESTAMP_FILE"
            git add "$TIMESTAMP_FILE"
            
            if ! git diff --cached --quiet; then
              git commit -m "python script: $(date -u)"
              git push origin HEAD
            fi
            
            echo "Waiting 3 minutes..."
            sleep 180
          done
